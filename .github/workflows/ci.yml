name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax
        run: |
          node --check index.js
          node --check client.js
          node --check lib/engine.js
          node --check lib/worktree.js
          for f in lib/sources/*.mjs lib/delivery/*.mjs; do node --check "$f"; done
      - name: offline test suites
        run: npm test
      - name: bundle manifest
        run: node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) throw new Error('missing dsh.bundle.patch'); if(p.private!==false) throw new Error('package must be publishable'); console.log('manifest ok', p.name, p.version)"
